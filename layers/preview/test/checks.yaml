# Every case states what it defends, so a failure here is actionable.
#
# The `compliant` fixture is the shape the layer asks for, modelled on a real
# Worker: production on a custom domain, pull requests built as Workers Previews
# (a `previews` block) behind their own Access application, the Worker verifying
# Access's token, no production data bound. Every check must pass on it — a
# check that rejects the shape it recommends would be turned off within a week.

- check: preview.workers-dev-off
  fixture: compliant
  expect: pass
  why: workers_dev false with a custom-domain route is the shape the layer asks for.
- check: preview.workers-dev-off
  fixture: compliant-toml
  expect: pass
  why: Plenty of Workers still use wrangler.toml, and a check that only reads JSON would fail every one of them for the wrong reason.
- check: preview.workers-dev-off
  fixture: workers-dev-on
  expect: fail
  why: A public workers.dev address sits outside the Access applications on the domain, so anybody with the URL reaches the Worker.
- check: preview.workers-dev-off
  fixture: workers-dev-unset
  expect: fail
  why: Wrangler turns workers.dev on when the key is absent, so silence is not safety.
- check: preview.workers-dev-off
  fixture: no-wrangler-config
  expect: fail
  why: A repository that adopted the preview layer with no Wrangler configuration has no previews, and a check that passed on nothing would say otherwise.

- check: preview.urls-on
  fixture: compliant
  expect: pass
  why: preview_urls true is what gives each Preview a workers.dev URL at all; with workers_dev off it would otherwise follow it to off.
- check: preview.urls-on
  fixture: compliant-toml
  expect: pass
  why: The TOML form of the same setting must read the same way.
- check: preview.urls-on
  fixture: preview-urls-off
  expect: fail
  why: With preview_urls false a Preview builds and nobody can open it, which looks like a working pipeline until somebody tries.

- check: preview.access-verified
  fixture: compliant
  expect: pass
  why: Reading cf-access-jwt-assertion and verifying it against the team's certs is the defence in depth the layer asks for.
- check: preview.access-verified
  fixture: compliant-toml
  expect: pass
  why: The Worker's source is found from the TOML file's main as well as the JSON one's.
- check: preview.access-verified
  fixture: no-access-verification
  expect: fail
  why: A Worker that trusts Access is in front of it answers anybody who reaches it another way.
- check: preview.access-verified
  fixture: header-read-not-verified
  expect: fail
  why: Checking that the header is present is not checking that it is genuine, and a test file that mentions jwtVerify must not count for the Worker.

- check: preview.preview-audience
  fixture: compliant
  expect: pass
  why: The preview Access application's AUD in vars, accepted by the Worker, is what lets a preview answer at all.
- check: preview.preview-audience
  fixture: no-preview-audience
  expect: fail
  why: Without the preview application's audience the Worker refuses every token minted for previews, so they answer 401 to everyone.
- check: preview.preview-audience
  fixture: previews-no-audience
  expect: fail
  why: A Preview reads its vars from the previews block alone, so an audience set only at the top level never reaches one, and every Preview refuses its own tokens.

- check: preview.workers-previews
  fixture: compliant
  expect: pass
  why: A previews block is how a repository says its pull requests build as Workers Previews, the route Cloudflare recommends.
- check: preview.workers-previews
  fixture: compliant-toml
  expect: pass
  why: A [previews] table in wrangler.toml is the same block and must read the same way.
- check: preview.workers-previews
  fixture: workers-previews
  expect: pass
  why: Workers Previews give each preview its own Durable Object namespace and a URL, so a class implemented here costs the repository nothing.
- check: preview.workers-previews
  fixture: versions-only
  expect: fail
  why: Without a previews block the only previews are uploaded versions, which run with production's bindings and which Cloudflare says not to use for pull request testing.
- check: preview.workers-previews
  fixture: durable-object-here
  expect: fail
  why: A Worker that implements a Durable Object gets no Version URL at all (error 1042), so without Workers Previews it has no previews.

- check: preview.previews-complete
  fixture: compliant
  expect: pass
  why: The previews block repeats the vars and the AI binding production has, so a Preview runs with everything the code reads.
- check: preview.previews-complete
  fixture: workers-previews
  expect: pass
  why: The Durable Object, the KV binding and every var production has are given again, with the preview's own KV namespace.
- check: preview.previews-complete
  fixture: versions-only
  expect: pass
  why: With no previews block there is nothing to compare; preview.workers-previews is the check that reports it, once.
- check: preview.previews-complete
  fixture: previews-incomplete
  expect: fail
  why: A Preview inherits nothing from the top level, so a Durable Object binding left out answers error 1101 and a var left out is undefined, on every Preview.

- check: preview.separate-data
  fixture: compliant
  expect: pass
  why: Workers AI, assets and vars hold no state, so a Worker bound to nothing else shares nothing with production.
- check: preview.separate-data
  fixture: versions-only
  expect: pass
  why: The older version route shares production's bindings, but a Worker bound to nothing that holds state still shares nothing.
- check: preview.separate-data
  fixture: shared-production-data
  expect: fail
  why: KV and D1 bound at the top level are production's, so a write in a preview is a write to production.
- check: preview.separate-data
  fixture: durable-object-elsewhere
  expect: fail
  why: Another Worker's Durable Object is still production's state, whichever Worker implements it.
- check: preview.separate-data
  fixture: workers-previews
  expect: pass
  why: Workers Previews inherit no bindings, so production's KV bound only at the top level does not reach a preview, and the previews block binds its own namespace and a per-preview Durable Object.
- check: preview.separate-data
  fixture: workers-previews-shared
  expect: fail
  why: A previews block that binds production's KV id, or another Worker's Durable Object, gives every preview production's data, however the block is spelled.

- check: preview.no-committed-token
  fixture: compliant
  expect: pass
  why: A workflow that reads the secret from CI secrets is how the token should reach a verify step, and must not read as a leak.
- check: preview.no-committed-token
  fixture: token-committed
  expect: fail
  why: A service token secret typed into a committed script opens every preview to whoever reads the repository.
- check: preview.no-committed-token
  fixture: token-in-vars
  expect: fail
  why: Wrangler vars are plain text in the repository and in the Worker, so the secret's name there is a secret in the open whatever its value looks like.
