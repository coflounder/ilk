id: ilk/ask-human
version: 0.3.0
summary: A written escalation path — an agent records a blocking question where a human will see it, and the repository refuses to pretend the answer is known.
facets:
  arc: operations
  kind: process
ilk: ">=0.2.0"

provides:
  ask.questions: "{{ .Vars.group }}/{{ .Vars.questions_dir }}"

variables:
  group:
    default: docs
    description: The grouping open questions sit in, alongside the rest of the record.
  questions_dir:
    default: questions
    description: >-
      Where open questions live. What makes one unmissable is `ilk check` failing
      while it is open, not where the folder sits.
  max_open_blocking:
    default: "0"
    description: >-
      How many blocking questions may sit open before `ilk check` fails. Zero means
      any open blocking question is a failure, which is the point: it is a stop
      sign, not a queue.

dirs:
  - group: "{{ .Vars.group }}"
    name: "{{ .Vars.questions_dir }}"
    order: 40
    purpose: Questions an agent could not answer for itself, and their answers.
    keep: true

files:
  - src: templates/README.md.tmpl
    dest: '{{ index .Caps "ask.questions" }}/README.md'
    mode: create-only
  - src: bin/ilk-ask-human.sh
    dest: .ilk/bin/ilk-ask-human.sh
    mode: managed
    exec: true

instructions:
  - id: ask
    src: instructions/ask.md.tmpl
    budget: 210

skills:
  - name: ask-a-human
    description: Escalate a decision you cannot make for yourself, without stalling or guessing. Use when a choice would be expensive to reverse, when the requirements genuinely contradict each other, when you need access or authority you do not have, or when you notice you are about to invent an assumption.
    src: skills/ask-a-human.md

checks:
  - id: ask.blocking
    kind: builtin.limit
    title: No blocking question is sitting unanswered
    fix: "Answer the question named above: edit the file, write the `## Answer`, and set `status: answered`. If it turns out not to be blocking after all, set `blocking: false` and say why in the document — a question that stops nothing should not stop everything."
    args:
      dirs: ['{{ index .Caps "ask.questions" }}']
      max: "{{ .Vars.max_open_blocking }}"
      where:
        status: open
        blocking: "true"
      exempt: [README.md]

  # A question that hands the whole problem back costs the person a working session.
  # One that names the two or three things it could be, and what each would mean,
  # can be answered from a phone in fifteen seconds — and the difference between
  # those two is most of whether a repository can run while nobody is watching.
  - id: ask.options
    title: A decision offers something to choose between
    run: .ilk/bin/ilk-ask-human.sh check-options
    fix: >-
      Add `options:` to the frontmatter — two to four of them, each with an `id:`, a
      `label:`, and a `consequence:` saying what it would mean to pick it — then
      `recommended:` naming the one you would choose. The consequence is the load
      bearing part: two options with no stated difference are one option asked
      twice. If you genuinely cannot list any, this is not a decision, and
      `kind: decision` is the wrong shape for it.

  - id: ask.answered
    kind: builtin.section
    title: Answered questions record the answer
    fix: "Add an `## Answer` section saying what was decided and by whom. An answer that lives only in a conversation is one the next session cannot inherit, which is the whole reason the question was written down."
    args:
      dirs: ['{{ index .Caps "ask.questions" }}']
      heading: Answer
      min_items: 1
      where:
        status: answered
      exempt: [README.md]

commands:
  - name: open
    summary: "Record a question that blocks you: ilk ask-human open [--decision] \"Should retries live in the gateway?\""
    run: .ilk/bin/ilk-ask-human.sh open
  - name: list
    summary: "Show open questions, blocking ones first: ilk ask-human list"
    run: .ilk/bin/ilk-ask-human.sh list

contribution:
  repo: coflounder/ilk
  path: layers/ask-human
  guidelines: CONTRIBUTING.md
