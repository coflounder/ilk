id: ilk/secrets
version: 0.1.0
summary: A credential caught before it is committed, and the part nobody writes down — what to do once one has leaked.
facets:
  arc: quality
  kind: gate
ilk: ">=0.2.0"

# Detection is solved. gitleaks and trufflehog are maintained by people who do
# nothing else, and a layer that reimplemented them would be worse within a
# month. What is missing is the discipline around the scanner: running it at the
# moment the fix is still cheap, and knowing what to do on the day it fires.
#
# So the scanner is a capability. A repository that already runs one declares it
# under `capabilities:` in .ilk/config.yaml and this layer wraps it; a
# repository that runs none gets the bundled floor below rather than a check
# that quietly skips.
provides:
  secrets.command: "{{ .Vars.scanner }}"

variables:
  scanner:
    default: .ilk/bin/ilk-secrets-scan.sh
    description: >-
      What actually scans. Set `secrets.command` under `capabilities:` in
      .ilk/config.yaml to point this at gitleaks, trufflehog or whatever this
      project already runs — a declared capability wins over this default. The
      bundled script is a floor, not a replacement for a maintained scanner: a
      handful of high-signal patterns so the layer catches something on the day
      it lands.
  allowlist:
    default: .ilk/secrets-allow
    description: >-
      Paths the bundled scanner does not read, one substring per line. For test
      fixtures and documentation that contains a credential shape on purpose.
      Never for a real credential — an allowlisted secret is a secret nobody
      will ever be told about again.

files:
  - src: bin/ilk-secrets-scan.sh
    dest: .ilk/bin/ilk-secrets-scan.sh
    mode: managed
    exec: true
  - src: templates/secrets-allow.tmpl
    dest: "{{ .Vars.allowlist }}"
    mode: create-only

instructions:
  - id: secrets
    src: instructions/secrets.md.tmpl
    budget: 130

skills:
  - name: handle-a-leaked-credential
    description: Work out what to do about a credential that has been committed, pushed, or pasted where it should not have been. Use the moment a scanner flags one, when a key turns up in a diff, a log or an issue, and before telling anybody about it.
    src: skills/handle-a-leaked-credential.md

checks:
  # Deliberately thin. The scanner is somebody else's, and everything this layer
  # knows that a scanner does not is in the fix and in the skill.
  - id: secrets.clean
    title: No credential is in the working tree
    requires: secrets.command
    run: '{{ index .Caps "secrets.command" }}'
    fix: >-
      Rotate the credential first. It is compromised the moment it is pushed,
      and deleting it in a new commit leaves it in the history, in every clone
      and in every fork — removal is cleanup, not the fix. Rotate, then purge it
      from history, then rotate again if the purge took a while. Read the
      handle-a-leaked-credential skill and follow it in that order. Never paste
      the value into an issue, a commit message or a pull request. If the match
      is not a credential — a fixture, a documented example — add its path to
      {{ .Vars.allowlist }} and say in the commit message why it is not one.

hooks:
  # The only moment the fix is cheap. Once it is pushed, rotation is the only
  # fix there is, so this one is worth blocking on.
  - event: pre-commit
    name: ilk-secrets
    blocking: true
    run: ilk check --only secrets.clean

contribution:
  repo: coflounder/ilk
  path: layers/secrets
  guidelines: CONTRIBUTING.md
