# Every case states what it defends, so a failure here is actionable.
#
# The fixtures contain deliberately invalid values — AWS's own documentation
# placeholder, and a private key header with prose where the key material would
# be. A fixture holding a realistic secret would be reported as a real leak by
# somebody eventually, and they would be right to.
- check: secrets.clean
  fixture: repo-with-aws-key
  expect: fail
  why: A key pasted into a deploy file to make something work is how nearly every leak starts.

- check: secrets.clean
  fixture: repo-with-private-key
  expect: fail
  why: A committed private key is the credential nobody rotates, because rotating it means touching what it deploys to.

- check: secrets.clean
  fixture: repo-with-no-secrets
  expect: pass
  why: Env lookups, a hex digest and prose describing what a key looks like must not fire, or the hook gets bypassed and every gate goes with it.
