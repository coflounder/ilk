# The ilk layer index.
#
# This is the whole registry: a list of names and where to fetch them. There is no
# server, no account and no publishing step beyond pushing a git repository and
# opening a pull request against this file.
#
# `ilk search` reads a copy of this index embedded in the binary, so discovery works
# offline. That copy is a snapshot taken at release time — a layer added here after
# your ilk was built is still adoptable by its source, it just will not be listed.
#
# To add a layer:
#   1. `ilk layer test ./your-layer` must pass. A layer that cannot be cleanly
#      removed is one nobody can safely try.
#   2. Add an entry below with a real source and an honest summary.
#   3. Open a pull request against internal/registry/registry.yaml — this file is
#      the whole index, and it is embedded into the binary at build time.
#
# Nothing here is endorsed or audited. Read a layer before adopting it — `ilk info`
# shows what it writes, what it costs in always-on context, and whether it runs code.

version: 1

layers:
  # ---------------------------------------------------------------- built in
  # Shipped inside the binary. Adoptable with no network access at all.

  - id: ilk/toolkit
    source: builtin
    summary: How to operate and extend ilk in this repository — adding layers, configuring, applying, resolving conflicts, and writing your own layer.
    arc: operations
    kind: process

  - id: ilk/record
    source: builtin
    summary: The project record — what is true, what is intended, what happened — plus the checks that keep it honest.
    arc: context
    kind: record

  - id: ilk/gates
    source: builtin
    summary: Verification an agent cannot talk its way past — tests, lint and build wired into `ilk check`, git hooks and CI.
    arc: quality
    kind: gate

  # --------------------------------------------------------------- community
  # Fetched from git. Each is versioned by tag.

  - id: ilk/blueprint
    source: gh:coflounder/ilk/layers/blueprint
    summary: One connected plan rather than a pile of tickets — epics, specs and milestones that must resolve, and acceptance criteria that must exist.
    arc: planning
    kind: process
    requires: [record.plans]

  - id: ilk/compound-lessons
    source: gh:coflounder/ilk/layers/compound-lessons
    summary: Turn a recurring problem into a durable change — a check, a skill or a convention — instead of advice that depends on everyone remembering it.
    arc: operations
    kind: process
    requires: [record.docs]

  - id: ilk/archive
    source: gh:coflounder/ilk/layers/archive
    summary: Supersede rather than delete — an archive the record can point back to, that live documents may not point into.
    arc: context
    kind: record
    requires: [record.docs]

  - id: ilk/ask-human
    source: gh:coflounder/ilk/layers/ask-human
    summary: A written escalation path — an agent records a blocking question where a human will see it, with the options and what each would mean, and the repository refuses to pretend the answer is known.
    arc: operations
    kind: process

  - id: ilk/dev-loops
    source: gh:coflounder/ilk/layers/dev-loops
    summary: Run an agent until a gate passes, not until it says it is finished — a bounded loop whose completion condition lives outside the model.
    arc: execution
    kind: harness
    requires: [test.command]

  - id: ilk/plan-hygiene
    source: gh:coflounder/ilk/layers/plan-hygiene
    summary: Backlog hygiene as failing checks rather than a meeting — a work-in-progress limit, active work that has an owner, and finished work that has evidence.
    arc: planning
    kind: gate
    requires: [record.plans]

  - id: ilk/visual-qa
    source: gh:coflounder/ilk/layers/visual-qa
    summary: An agent that changes the interface has to show you what it looks like — screenshots captured against the acceptance criteria, kept with the work.
    arc: quality
    kind: gate
    requires: [record.plans]

  - id: ilk/gh-projects
    source: gh:coflounder/ilk/layers/gh-projects
    summary: Keep a GitHub Project in agreement with the record — the plan is the source of truth, the board is a view of it, and a write is either correct or it does not happen.
    arc: planning
    kind: integration
    requires: [record.plans]

  - id: ilk/maintainer
    source: gh:coflounder/ilk/layers/maintainer
    summary: The receiving end of the flywheel — proposals from repositories using your layers arrive as reviewable documents, and a proposal nobody can judge fails the checks rather than sitting in a queue.
    arc: operations
    kind: process

  - id: ilk/autoresearch
    source: gh:coflounder/ilk/layers/autoresearch
    summary: Findings about the world outside the repository — sourced, falsifiable and dated — so no session pays to derive them twice.
    arc: context
    kind: record

  - id: ilk/deprecation
    source: gh:coflounder/ilk/layers/deprecation
    summary: A removal date the code is held to — deprecations that expire, and that tell you when the removal is finished.
    arc: quality
    kind: process
    requires: [record.docs]

  - id: ilk/pr-prep
    source: gh:coflounder/ilk/layers/pr-prep
    summary: Pull request descriptions derived from the plan document rather than written from memory — the outcome, the acceptance criteria and the evidence, assembled by a command instead of recalled.
    arc: release
    kind: process
    requires: [record.plans]

  - id: ilk/secrets
    source: gh:coflounder/ilk/layers/secrets
    summary: A credential caught before it is committed, and the part nobody writes down — what to do once one has leaked.
    arc: quality
    kind: gate

  - id: ilk/html-wireframe
    source: gh:coflounder/ilk/layers/html-wireframe
    summary: Interface work is agreed as a wireframe before it is built — a plain HTML sketch anybody can open, cheap enough to throw away while disagreeing is still cheap.
    arc: planning
    kind: process
    requires: [record.plans]

  - id: ilk/gauntlet
    source: gh:coflounder/ilk/layers/gauntlet
    summary: The builder does not grade its own homework — work is not done until somebody who did not do it has compared it against something inspectable and named the largest remaining gap.
    arc: quality
    kind: gate
    requires: [record.plans]

  - id: ilk/routine
    source: gh:coflounder/ilk/layers/routine
    summary: Scheduled work as a document rather than a cron line — owned, budgeted, and re-read on a date instead of running unwatched for ever.
    arc: operations
    kind: process

  - id: ilk/pulumi
    source: gh:coflounder/ilk/layers/pulumi
    summary: Infrastructure as code with the one discipline that matters when an agent holds the keys — preview is agent work, apply is human work.
    arc: operations
    kind: gate
    requires: [infra.preview.command, infra.up.command]
