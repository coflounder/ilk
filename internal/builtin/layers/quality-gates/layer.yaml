id: ilk/quality-gates
version: 0.1.0
summary: Verification an agent cannot talk its way past — tests, lint and build wired into `ilk check`, git hooks and CI.
facets:
  arc: quality
  kind: gate
ilk: ">=0.1.0"

# A capability, not a layer name: any repository or layer that supplies
# `test.command` satisfies this, whatever language it is written in.
requires:
  - test.command

provides:
  - gates.tests
  - gates.review

variables:
  ci:
    default: github
    enum: [github, none]
    description: Emit a CI workflow that runs the same gates the hooks run.

files:
  - src: templates/workflow.yml.tmpl
    dest: .github/workflows/ilk.yml
    mode: create-only
    when: '{{ eq .Vars.ci "github" }}'

instructions:
  - id: gates
    src: instructions/gates.md.tmpl
    budget: 150

skills:
  - name: prove-it
    description: Turn a claim that work is done into evidence a reviewer can check. Use before marking a task complete, opening a pull request, or reporting a result.
    src: skills/prove-it.md
  - name: review-changes
    description: Review a change the way this repository expects, before it is proposed. Use when preparing a pull request or when asked to review a diff.
    src: skills/review-changes.md

checks:
  - id: gates.tests
    title: The test suite passes
    requires: test.command
    run: '{{ index .Caps "test.command" }}'
    fix: "Read the failing test's output and fix the code, or fix the test if the behaviour it asserts is genuinely wrong. Do not mark work complete while this fails."
  - id: gates.lint
    title: The linter is clean
    requires: lint.command
    run: '{{ index .Caps "lint.command" }}'
    fix: "Run the linter's own fixer if it has one, then correct what remains by hand."
  - id: gates.build
    title: The project builds
    requires: build.command
    run: '{{ index .Caps "build.command" }}'
    fix: "Fix the compilation or build failure named in the output."

hooks:
  - event: pre-push
    name: ilk-gates
    blocking: true
    run: ilk check --only gates.tests,gates.lint,gates.build
