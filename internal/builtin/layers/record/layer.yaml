id: ilk/record
version: 0.2.0
summary: The project record — what is true, what is intended, what happened — plus the checks that keep it honest.
facets:
  arc: context
  kind: record
ilk: ">=0.2.0"

# Each capability carries the path it names, so a layer that needs the plans can
# find them instead of redeclaring `plans_dir: plans` and hoping it still matches.
provides:
  record.docs: "{{ .Vars.group }}/{{ .Vars.reference_dir }}"
  record.plans: "{{ .Vars.group }}/{{ .Vars.plans_dir }}"
  record.log: "{{ .Vars.group }}/{{ .Vars.log_dir }}"
  record.scratch: "{{ .Vars.scratch_dir }}"

variables:
  group:
    default: docs
    description: >-
      The top-level grouping the record lives under. One folder at the root
      holding four, rather than four at the root — which is what keeps a
      repository navigable as layers accumulate.
  reference_dir:
    default: reference
    description: Where current truth lives, inside the group.
  plans_dir:
    default: plans
    description: Where intent lives, inside the group.
  log_dir:
    default: log
    description: Where history lives, inside the group.
  scratch_dir:
    default: scratch
    description: >-
      The ungoverned annex. Nothing here is checked, and it stays at the
      repository root on purpose: filing it under the record would make it look
      governed, which is the one thing it must not be.
  review_after_commits:
    default: "10"
    description: >-
      How many commits may touch the code a document covers before the document
      needs re-reading. Measured against the document's own `covers:` patterns, so
      a stable subsystem never goes stale and a churning one goes stale fast — the
      project's pace sets the pace of review.
  max_age_days:
    default: "0"
    description: >-
      Optional absolute review interval, off by default. Set it only if documents
      here go stale because the world moved rather than the code — an external API,
      a vendor's behaviour — which watching this repository can never detect.

dirs:
  - group: "{{ .Vars.group }}"
    name: "{{ .Vars.reference_dir }}"
    order: 10
    purpose: What is true now — architecture, interfaces, operations, decisions.
    keep: true
  - group: "{{ .Vars.group }}"
    name: "{{ .Vars.plans_dir }}"
    order: 20
    purpose: What we intend to build, and what must be true before it is accepted.
    keep: true
  - group: "{{ .Vars.group }}"
    name: "{{ .Vars.log_dir }}"
    order: 30
    purpose: What happened — dated entries, append-only in spirit.
    keep: true
  - path: "{{ .Vars.scratch_dir }}"
    purpose: Rough notes. Ungoverned on purpose, so the other three stay clean.
    keep: true
    ignore: true

files:
  - src: templates/docs-README.md.tmpl
    dest: '{{ index .Caps "record.docs" }}/README.md'
    mode: create-only
  - src: templates/plans-README.md.tmpl
    dest: '{{ index .Caps "record.plans" }}/README.md'
    mode: create-only
  - src: templates/log-README.md.tmpl
    dest: '{{ index .Caps "record.log" }}/README.md'
    mode: create-only
  - src: templates/scratch-README.md.tmpl
    dest: '{{ index .Caps "record.scratch" }}/README.md'
    mode: create-only
  - src: bin/ilk-record-new.sh
    dest: .ilk/bin/ilk-record-new.sh
    mode: managed
    exec: true
  - src: bin/ilk-record-review.sh
    dest: .ilk/bin/ilk-record-review.sh
    mode: managed
    exec: true

instructions:
  - id: contract
    src: instructions/contract.md.tmpl
    budget: 380

skills:
  - name: write-decision
    description: Record an architectural or process decision so future sessions inherit it. Use when a choice is made that a later reader would otherwise have to reverse-engineer, or would plausibly undo by accident.
    src: skills/write-decision.md
  - name: update-record
    description: Bring the project record back in line with the code after a change. Use after shipping work that alters architecture, interfaces, or operational behaviour, or when `ilk check` reports a stale document.
    src: skills/update-record.md

checks:
  - id: record.frontmatter
    kind: builtin.frontmatter
    title: Record documents carry the required frontmatter
    fix: 'Add the missing keys to the file''s YAML frontmatter. `{{ index .Caps "record.docs" }}/README.md` shows the shape, or run `ilk record new` to create documents that already have it.'
    args:
      dirs:
        - '{{ index .Caps "record.docs" }}'
        - '{{ index .Caps "record.plans" }}'
      require: [id, title, status, updated]
      exempt: [README.md]
  - id: record.log-frontmatter
    kind: builtin.frontmatter
    title: Log entries carry the required frontmatter
    fix: "Add `date` and `title` to the entry's YAML frontmatter, or create entries with `ilk record log \"...\"`."
    args:
      dirs:
        - '{{ index .Caps "record.log" }}'
      require: [date, title]
      exempt: [README.md]
  - id: record.naming
    kind: builtin.naming
    title: Record filenames follow the grammar the parser knows
    fix: "Rename the file to match the grammar. `ARCH-system-overview.md` is a record; `arch_system_overview.md` is an error."
    args:
      rules:
        - dir: '{{ index .Caps "record.docs" }}'
          pattern: "^[A-Z]{2,6}-[a-z0-9]+(-[a-z0-9]+)*\\.md$"
          example: ARCH-system-overview.md
        - dir: '{{ index .Caps "record.plans" }}'
          pattern: "^[A-Z]{2,6}-[a-z0-9]+(-[a-z0-9]+)*\\.md$"
          example: PLAN-billing-rewrite.md
        - dir: '{{ index .Caps "record.log" }}'
          pattern: "^\\d{4}-\\d{2}-\\d{2}-[a-z0-9]+(-[a-z0-9]+)*\\.md$"
          example: 2026-08-06-shipped-billing.md
      exempt: [README.md]
  - id: record.links
    kind: builtin.links
    title: Cross-references between record documents resolve
    fix: "Point the link at a file that exists, or create the document it names. A plan referring to a document that was never written is the drift this check exists to catch."
    args:
      dirs:
        - '{{ index .Caps "record.docs" }}'
        - '{{ index .Caps "record.plans" }}'
        - '{{ index .Caps "record.log" }}'
  - id: record.stale
    kind: builtin.stale
    title: Documents have not fallen behind the code they describe
    fix: "Run `ilk record review <file>` — it shows exactly what changed under the document's `covers:` paths since it was last read, then records that you have looked. If the document is wrong, fix it; if it is still right, the review alone is the answer."
    args:
      dirs:
        - '{{ index .Caps "record.docs" }}'
      review_after_commits: "{{ .Vars.review_after_commits }}"
      max_age_days: "{{ .Vars.max_age_days }}"
      exempt: [README.md]
  - id: record.coverage
    kind: builtin.coverage
    title: Documents declare what they describe, so staleness can be detected
    fix: "Add a `covers:` list to the frontmatter naming the paths this document describes, e.g. `covers: [src/payments/**]`. A document that covers nothing is never stale, which is indistinguishable from one that is always right — and a pattern matching nothing is worse, because it looks like it is working."
    args:
      dirs:
        - '{{ index .Caps "record.docs" }}'
      exempt: [README.md]

hooks:
  - event: session-start
    name: ilk-brief
    run: ilk brief
  - event: pre-commit
    name: ilk-record-check
    blocking: true
    run: ilk check --only record.frontmatter,record.log-frontmatter,record.naming,record.links

commands:
  - name: new
    summary: "Create a record document with correct naming and frontmatter: ilk record new <docs|plans|log> <title>"
    run: .ilk/bin/ilk-record-new.sh
  - name: log
    summary: "Append a dated entry to the log: ilk record log <title>"
    run: .ilk/bin/ilk-record-new.sh log
  - name: review
    summary: "Show what changed under a document's covers: paths, then record that you have read it: ilk record review <file>"
    run: .ilk/bin/ilk-record-review.sh

contribution:
  repo: coflounder/ilk
  path: internal/builtin/layers/record
  guidelines: CONTRIBUTING.md
