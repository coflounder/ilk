# Seeded by ilk and yours to edit — ilk will not touch this file again.
#
# Edited, because this repository is ilk. The version the gates layer seeds
# installs a published release, which is right for a repository that merely uses
# ilk and wrong here twice over: it would check a pull request with whatever was
# released rather than with the code under review, and there is no release to
# install until the first tag exists.
name: ilk

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: ilk check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `record.stale` compares documents against the history of the code they
          # describe, so it needs more than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      # Build the ilk under review and check this repository with it. The
      # built-in layers are embedded in the binary, so this is also the only way
      # the checks a change makes to `record` or `gates` are exercised against
      # the repository that ships them.
      - name: Build ilk from this checkout
        run: |
          go build -o "$RUNNER_TEMP/ilk" ./cmd/ilk
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Gates that matter run here, not only in an agent's hooks. An agent that
      # ignores its instructions still cannot push past this job.
      - name: Check
        run: ilk check --json
