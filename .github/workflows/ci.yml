name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o ilk ./cmd/ilk

      # The built-in layers must keep the same contract every published layer is
      # held to: adopt is idempotent, and drop restores the repository.
      - name: Layer contract
        run: |
          set -e
          for layer in internal/builtin/layers/*/ layers/*/; do
            [ -f "$layer/layer.yaml" ] || continue
            echo "→ $layer"
            ./ilk layer validate "$layer"
            ./ilk layer test "$layer"
          done

      # A layer that talks to somebody else's system carries its own provider tests,
      # run against a fake so CI needs no network, no account, and nothing to clean up.
      # It cannot prove the real API calls are right — only that the contract with ilk
      # holds and that every refusal still refuses.
      - name: Layer provider tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          for suite in layers/*/test/run.sh internal/builtin/layers/*/test/run.sh; do
            [ -f "$suite" ] || continue
            echo "→ $suite"
            sh "$suite"
          done

      # Every layer in the index must actually resolve, or `ilk search` is
      # advertising things nobody can adopt.
      - name: Registry index
        shell: bash
        run: |
          set -e
          ./ilk search --all --json > /tmp/index.json
          python3 - <<'PY'
          import json, os, sys
          entries = json.load(open("/tmp/index.json"))
          if not entries:
              sys.exit("the index is empty")
          missing = []
          for e in entries:
              src = e["source"]
              if src == "builtin":
                  if not os.path.isdir("internal/builtin/layers/" + e["id"].split("/")[-1]):
                      missing.append(e["id"] + " (no built-in directory)")
              elif src.startswith("gh:coflounder/ilk/"):
                  path = src[len("gh:coflounder/ilk/"):]
                  if not os.path.isfile(path + "/layer.yaml"):
                      missing.append(e["id"] + " (" + path + " has no layer.yaml)")
          if missing:
              sys.exit("index entries that do not resolve:\n  " + "\n  ".join(missing))
          print(f"{len(entries)} indexed layers all resolve")
          PY

      # A layer that cannot be improved by the repositories using it decays. This
      # is cheap to check and impossible to notice by hand once there are a dozen
      # layers, so it is checked.
      - name: Every layer accepts contributions
        shell: bash
        run: |
          set -e
          missing=()
          for layer in internal/builtin/layers/*/ layers/*/; do
            [ -f "$layer/layer.yaml" ] || continue
            grep -q '^contribution:' "$layer/layer.yaml" || missing+=("$layer (no contribution: block)")
            guidelines=$(sed -n 's/^  guidelines: *//p' "$layer/layer.yaml" | head -1)
            if [ -n "$guidelines" ] && [ ! -f "$layer/$guidelines" ]; then
              missing+=("$layer (names $guidelines, which is not there)")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'layers that cannot receive what their adopters learn:\n'
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "every layer declares where proposals go"

      # Prove the thing the README claims: one command produces a repository that
      # validates, and the whole cycle is reversible.
      - name: End-to-end
        shell: bash
        run: |
          set -e
          bin="$PWD/ilk"
          work=$(mktemp -d)
          cd "$work"
          git init -q .
          git config user.email ci@example.com
          git config user.name CI
          printf '# Sample\n\nProse a human wrote.\n' > README.md
          printf 'node_modules\n' > .gitignore
          git add -A && git commit -qm init

          "$bin" init -y --profile standard --test-command "true"
          "$bin" check
          "$bin" brief > /dev/null
          "$bin" status > /dev/null
          "$bin" doctor || true
          "$bin" check --json > /dev/null
          "$bin" brief --json > /dev/null

          # A second apply must be a no-op.
          "$bin" apply -y | tee out.txt
          grep -q "Already up to date" out.txt

          "$bin" drop quality-gates -y
          "$bin" drop record -y
          "$bin" agents remove claude-code -y
          test "$(cat README.md)" = "$(printf '# Sample\n\nProse a human wrote.')"

      # Adopting into a repository that already has documentation must not open
      # with a wall of failures about files nobody has touched.
      - name: Brownfield adoption
        shell: bash
        run: |
          set -e
          bin="$PWD/ilk"
          work=$(mktemp -d)
          cd "$work"
          git init -q . && git config user.email ci@example.com && git config user.name CI
          mkdir -p docs
          printf '# Guide\n' > docs/getting_started.md
          printf '# Sample\n' > README.md
          git add -A && git commit -qm init

          "$bin" init -y
          "$bin" check                       # clean: the existing file is exempt
          "$bin" baseline list | grep -q docs/getting_started.md

          # A file added after adoption is governed normally.
          printf '# Nope\n' > docs/badly_named.md
          if "$bin" check --only record.naming; then
            echo "a new non-conforming file should have failed the naming check"
            exit 1
          fi
          rm docs/badly_named.md

          # Clearing the exemption holds the old file to the rules.
          "$bin" baseline clear docs/getting_started.md
          if "$bin" check --only record.naming; then
            echo "a cleared file should be checked"
            exit 1
          fi

      # Staleness must track the code a document covers, not the calendar.
      - name: Staleness by coupling
        shell: bash
        run: |
          set -e
          bin="$PWD/ilk"
          work=$(mktemp -d)
          cd "$work"
          git init -q . && git config user.email ci@example.com && git config user.name CI
          mkdir -p src/hot src/frozen
          echo 'package hot' > src/hot/a.go
          echo 'package frozen' > src/frozen/b.go
          printf '# Sample\n' > README.md
          git add -A && git commit -qm init
          "$bin" init -y

          for name in hot frozen; do
            cat > "docs/ARCH-$name.md" <<EOF
          ---
          id: arch-$name
          title: $name
          status: current
          updated: 2020-01-01
          covers:
            - src/$name/**
          ---
          # $name
          EOF
          done
          git add -A && git commit -qm "add docs"

          # Churn one subsystem; leave the other alone.
          for i in $(seq 1 12); do
            echo "// $i" >> src/hot/a.go
            git commit -qam "hot $i"
          done

          out=$("$bin" check --only record.stale --json || true)
          echo "$out" | grep -q 'ARCH-hot.md' || { echo "churning code should make its doc stale"; exit 1; }
          if echo "$out" | grep -q 'ARCH-frozen.md'; then
            echo "a doc about untouched code must not go stale, however old"
            exit 1
          fi

          # A covers: pattern matching nothing is a silent exemption, not a pass.
          sed -i 's|src/frozen/\*\*|src/frozn/**|' docs/ARCH-frozen.md
          if "$bin" check --only record.coverage; then
            echo "a covers: pattern matching nothing should be reported"
            exit 1
          fi

  shellcheck:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install.sh internal/builtin/layers/*/bin/*.sh

  node:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: |
          node --check npm/install.js
          node --check npm/bin/ilk
      - name: Version agreement
        run: |
          # The npm package resolves its binary from the release tagged with its
          # own version, so the two must not drift.
          node -e "
            const pkg = require('./npm/package.json');
            if (!/^\d+\.\d+\.\d+$/.test(pkg.version)) {
              console.error('npm/package.json version must be a plain semver: ' + pkg.version);
              process.exit(1);
            }
          "
